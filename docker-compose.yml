version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: genharmony_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: moni07
      POSTGRES_DB: music_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: genharmony_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:moni07@db:5432/music_db
      SECRET_KEY: genharmony_very_secure_key_987654321
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - backend_uploads:/app/uploads
      - backend_generated:/app/generated_music

  frontend:
    build: ./frontend
    container_name: genharmony_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
  backend_generated:
